server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Quartz emits file.html (no trailing slash, no /index.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Immutable cache for content-hashed assets (Quartz emits *-<8hex>.css/.js)
    location ~* -[0-9a-f]{8}\.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Standard static assets (non-hashed)
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/rss+xml
        text/xml
        image/svg+xml;
}
